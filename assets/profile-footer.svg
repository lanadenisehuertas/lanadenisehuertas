<svg width="1200" height="220" viewBox="0 0 1200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Palette sampled directly from lana-profile-header-purple.png so the footer
       closes the page in the same plum the header opens it with. -->
  <defs>
    <linearGradient id="plum" x1="0" y1="0" x2="1200" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#190F1C"/>
      <stop offset="0.24" stop-color="#2A1533"/>
      <stop offset="0.54" stop-color="#4A2555"/>
      <stop offset="0.80" stop-color="#673378"/>
      <stop offset="1" stop-color="#241430"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="420" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8DCEF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E8DCEF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E8DCEF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(600 185) rotate(-90) scale(155 520)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BF7FD9" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#BF7FD9" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <clipPath id="waveClip">
      <path d="M0 57C176 8 308 101 487 66C685 27 791 4 968 39C1061 58 1137 66 1200 49V220H0V57Z"/>
    </clipPath>
  </defs>

  <style>
    /* Same technique the snake animation uses — CSS keyframes inside the SVG,
       which GitHub renders through camo without stripping. */
    .sheen   { animation: sweep 7s ease-in-out infinite; }
    .twinkle { animation: blink 3.4s ease-in-out infinite; }
    .t2      { animation-delay: .7s; }
    .t3      { animation-delay: 1.4s; }
    .t4      { animation-delay: 2.1s; }
    .drift   { animation: float 6s ease-in-out infinite; }
    .d2      { animation-delay: 1.6s; }

    @keyframes sweep { 0% { transform: translateX(-460px); } 55%, 100% { transform: translateX(1300px); } }
    @keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: .9; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

    @media (prefers-reduced-motion: reduce) {
      .sheen, .twinkle, .drift { animation: none; }
    }
  </style>

  <path d="M0 57C176 8 308 101 487 66C685 27 791 4 968 39C1061 58 1137 66 1200 49V220H0V57Z" fill="url(#plum)"/>
  <ellipse cx="600" cy="184" rx="430" ry="110" fill="url(#glow)" filter="url(#soft)"/>

  <g clip-path="url(#waveClip)">
    <rect class="sheen" x="0" y="0" width="420" height="220" fill="url(#sheen)"/>
  </g>

  <g fill="#F7F2FA">
    <circle class="twinkle" cx="92" cy="116" r="2"/>
    <circle class="twinkle t2" cx="174" cy="80" r="1.5"/>
    <circle class="twinkle t3" cx="1035" cy="107" r="2"/>
    <circle class="twinkle t4" cx="1114" cy="86" r="1.5"/>
    <g class="drift">
      <path d="M244 127H256M250 121V133" stroke="#F7F2FA" stroke-width="1.5" opacity="0.8"/>
    </g>
    <g class="drift d2">
      <path d="M944 121H956M950 115V127" stroke="#F7F2FA" stroke-width="1.5" opacity="0.8"/>
    </g>
  </g>

  <text x="600" y="135" fill="white" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-style="italic" letter-spacing="1">
    Designing with intention · building with care
  </text>
  <text x="600" y="168" fill="#E8DCEF" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="4">
    LANA HUERTAS · MANILA
  </text>
</svg>
